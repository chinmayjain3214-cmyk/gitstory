<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="gitstory">
<meta name="color-scheme" content="dark light">
<title>{{TITLE}}</title>
<style>
{{CSS}}
</style>
</head>
<body>
<button class="theme-toggle" id="theme-toggle" type="button">Light theme</button>
<nav class="report-nav" id="report-nav" aria-label="gitstory" hidden></nav>

<main class="story">
  <header class="hero">
    <p class="hero-kicker">The story of</p>
    <h1 class="hero-title" id="repo-name"></h1>
    <a class="hero-source" id="hero-source" target="_blank" rel="noopener noreferrer" hidden></a>
    <p class="hero-lede" id="hero-lede"></p>
    <div class="hero-diffstat" id="hero-diffstat"></div>
    <p class="hero-filters" id="hero-filters" hidden></p>
  </header>

  <section class="chapter reveal" id="timeline" aria-labelledby="timeline-title">
    <h2 class="chapter-title" id="timeline-title">Timeline</h2>
    <p class="chapter-lede" id="timeline-lede"></p>
    <div class="panel">
      <div class="timeline-chart" id="timeline-chart"></div>
    </div>
  </section>

  <section class="chapter reveal" id="contributors" aria-labelledby="contributors-title">
    <h2 class="chapter-title" id="contributors-title">Contributors</h2>
    <p class="chapter-lede" id="contributors-lede"></p>
    <ol class="people" id="people"></ol>
    <div class="people-more" id="people-more"></div>
  </section>

  <section class="chapter reveal" id="rhythm" aria-labelledby="rhythm-title">
    <h2 class="chapter-title" id="rhythm-title">When the code gets written</h2>
    <p class="chapter-lede" id="rhythm-lede"></p>
    <div class="rhythm">
      <div class="panel">
        <div class="heatmap" id="heatmap"></div>
        <div class="heatmap-legend" id="heatmap-legend"></div>
      </div>
      <aside class="persona" id="persona"></aside>
    </div>
  </section>

  <section class="chapter reveal" id="churn" aria-labelledby="churn-title">
    <h2 class="chapter-title" id="churn-title">File churn</h2>
    <p class="chapter-lede" id="churn-lede"></p>
    <div class="churn">
      <div class="panel">
        <h3 class="panel-title">Most-changed files</h3>
        <div class="legend" id="churn-legend"></div>
        <ol class="bars" id="churn-files"></ol>
      </div>
      <div class="panel">
        <h3 class="panel-title">Languages by lines changed</h3>
        <ol class="bars" id="churn-extensions"></ol>
      </div>
    </div>
  </section>

  <section class="chapter reveal" id="messages" aria-labelledby="messages-title">
    <h2 class="chapter-title" id="messages-title">Commit message insights</h2>
    <p class="chapter-lede" id="messages-lede"></p>
    <div class="tiles" id="message-tiles"></div>
    <div class="messages">
      <div class="panel">
        <h3 class="panel-title">Most common words</h3>
        <ol class="bars" id="message-words"></ol>
      </div>
      <div class="quotes" id="message-quotes"></div>
    </div>
  </section>

  <section class="chapter reveal" id="facts" aria-labelledby="facts-title">
    <h2 class="chapter-title" id="facts-title">Fun facts</h2>
    <div class="facts" id="fact-cards"></div>
  </section>
</main>

<footer class="footer">
  <p>Generated by <strong>gitstory</strong><span id="footer-meta"></span></p>
</footer>

<div class="tooltip" id="tooltip" role="status" aria-live="polite" hidden></div>
<noscript><p class="noscript">This report draws its charts with JavaScript. Enable JavaScript to see it.</p></noscript>

<script id="gitstory-data" type="application/json">{{DATA}}</script>
<script>
{{JS}}
</script>
</body>
</html>
